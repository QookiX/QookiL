<style>
/* ============ 主题令牌：颜色取自 QookiL 品牌标志（赤陶/暖棕），比例沿用发牌结构 ============ */
:root {
  --bg: #140b07;        /* 地面：近黑的暖棕 */
  --surface: #251510;   /* 表面一步：文件行 A */
  --surface-2: #2c1a13; /* 表面两步：文件行 B / 悬停 */
  --field: #3b2013;     /* 舞台：列表底 / 强调块 */
  --crumb: #4a2817;     /* 面包屑块 */
  --ink: #ffffff;       /* 墨：正文全色 */
  --muted: #b09a8b;     /* 次级墨 */
  --accent: #cb7740;    /* 品牌赤陶色：主操作 + 页脚字标 */
  --accent-ink: #140b07;
  --radius: 4px;        /* 全页唯一圆角 */
  --margin: 24px;       /* 全页唯一页边距 */
  --step-hero: 27px;
  --step-section: clamp(36px, 9vw, 56px);
  --step-send: clamp(24px, 6vw, 32px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { color-scheme: dark; scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
               system-ui, "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg); color: var(--ink);
  font-size: 16px; line-height: 1.5;
  min-height: 100svh;
}
img { display: block; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* ============ 顶栏 ============ */
.top {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) var(--margin) 0;
}
.mark { width: 32px; height: 32px; }
.corner {
  font-size: 14px; text-decoration: underline; text-underline-offset: 5px;
  text-decoration-thickness: 1.5px; padding: 8px 2px;
}
.corner:active { opacity: .6; }

/* ============ 首屏 ============ */
.hero { padding: 0 var(--margin); margin-top: 56px; }
.hero h1 {
  font-size: var(--step-hero); font-weight: 600;
  letter-spacing: -0.02em; line-height: 1.3;
}
.lead {
  margin-top: 18px; max-width: 34em;
  font-size: 16px; line-height: 1.65; color: var(--muted);
}
.live {
  margin-top: 16px; display: flex; align-items: center; gap: 9px;
  font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.dot { width: 9px; height: 9px; background: var(--muted); flex: none; }
.dot.on { background: var(--accent); }
.actions { margin-top: 30px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.btn {
  background: var(--accent); color: var(--accent-ink);
  font-weight: 600; font-size: 16px;
  padding: 14px 24px; border-radius: var(--radius);
}
.btn:active { transform: translateY(1px); filter: brightness(1.08); }
.arrow {
  font-size: 16px; text-decoration: underline; text-underline-offset: 6px;
  text-decoration-thickness: 1.5px; padding: 6px 1px;
}
.arrow:active { opacity: .6; }

/* ============ 共享列表 ============ */
.shares { margin-top: 84px; padding: 0 var(--margin); }
.shares-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.shares-head h2 {
  font-size: var(--step-section); font-weight: 600;
  letter-spacing: -0.03em; line-height: 1.08;
}
.shares-head h2 .soft { color: var(--muted); font-weight: 500; }
.count { font-size: 14px; color: var(--muted); flex: none; padding-bottom: 8px; font-variant-numeric: tabular-nums; }

/* 产品本体：真实文件列表（界面碎片） */
.fragment {
  margin-top: 26px; background: var(--field);
  padding: 8px; border-radius: var(--radius);
  transition: opacity .3s ease-out;
  max-width: 720px;
}
.fragment.swap { opacity: 0; }

.crumbs { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 4px 10px; }
.crumbs:empty { display: none; }
.crumb {
  background: var(--crumb); color: var(--ink);
  font-size: 14px; padding: 7px 13px; border-radius: var(--radius);
}
.crumb.on { background: var(--ink); color: var(--bg); font-weight: 600; }
.crumb:active { filter: brightness(1.25); }

.rows { display: flex; flex-direction: column; gap: 4px; }
.row {
  display: flex; align-items: center; gap: 13px;
  padding: 11px 13px; border-radius: var(--radius);
  cursor: pointer; text-align: left; width: 100%;
}
.row:focus-visible { outline-offset: -2px; }
.row:nth-child(odd) { background: var(--surface); }
.row:nth-child(even) { background: var(--surface-2); }
.row:active { filter: brightness(1.3); }
.thumb { width: 48px; height: 48px; flex: none; border-radius: var(--radius); overflow: hidden; position: relative; background: var(--field); }
.thumb svg { width: 100%; height: 100%; color: var(--muted); }
.thumb img { width: 100%; height: 100%; object-fit: cover; animation: slowzoom 18s ease-in-out infinite alternate; }
@keyframes slowzoom { from { transform: scale(1); } to { transform: scale(1.18); } }
.badge {
  position: absolute; right: 3px; bottom: 3px;
  width: 18px; height: 18px; border-radius: 3px;
  background: var(--accent); display: flex; align-items: center; justify-content: center;
}
.badge svg { width: 11px; height: 11px; color: var(--accent-ink); }
.mcol { flex: 1; min-width: 0; }
.nm { font-size: 17px; font-weight: 500; line-height: 1.3; word-break: break-all; }
.meta { font-size: 13px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.side { display: flex; align-items: center; gap: 8px; flex: none; }
.size { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side svg { width: 18px; height: 18px; color: var(--muted); }
.row .go { display: flex; padding: 8px; border-radius: var(--radius); }
.row .go:active { filter: brightness(1.4); }
.row .go svg { color: var(--ink); }

.hint { padding: 18px 13px 14px; font-size: 14px; line-height: 1.6; color: var(--muted); }

/* ============ 照片区块：共享的真实照片，点开即看 ============ */
.gallery { margin-top: 96px; padding: 0 var(--margin); }
.gallery h2 {
  font-size: var(--step-hero); font-weight: 600;
  letter-spacing: -0.02em; line-height: 1.3;
}
.tiles { margin-top: 22px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
.tile {
  position: relative; aspect-ratio: 4/3;
  border-radius: var(--radius); overflow: hidden; background: var(--surface);
}
.tile img { width: 100%; height: 100%; object-fit: cover; animation: slowzoom 18s ease-in-out infinite alternate; }
.tile:active { filter: brightness(1.25); }

/* ============ 发送（CTA） ============ */
.send { margin-top: 96px; padding: 0 var(--margin); }
.send-line {
  font-size: var(--step-send); font-weight: 600;
  letter-spacing: -0.02em; line-height: 1.5;
}
.send-btn {
  background: var(--accent); color: var(--accent-ink);
  font-size: inherit; font-weight: 600; letter-spacing: inherit;
  padding: .04em .3em; border-radius: var(--radius);
  vertical-align: baseline; margin-left: .12em;
}
.send-btn:active { transform: translateY(1px); filter: brightness(1.08); }
.send-note { margin-top: 20px; font-size: 16px; color: var(--muted); line-height: 1.65; max-width: 34em; }
.prog { margin-top: 26px; max-width: 34em; }
.track { height: 10px; background: var(--field); border-radius: var(--radius); overflow: hidden; }
.fill { height: 100%; width: 0%; background: var(--accent); border-radius: var(--radius); transition: width .2s linear; }
.ptext { margin-top: 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ============ 页脚 ============ */
footer { margin-top: 130px; padding: 0 var(--margin) calc(env(safe-area-inset-bottom, 0px) + 52px); }
.wordmark {
  font-size: clamp(88px, 19vw, 240px); font-weight: 600;
  letter-spacing: -0.04em; line-height: .82; color: var(--accent);
  user-select: none;
}
.foot-line { margin-top: 26px; font-size: 14px; color: var(--muted); }

/* ============ 浮层：提示与预览 ============ */
.toast {
  position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 16px);
  background: var(--surface-2); color: var(--ink);
  font-size: 14px; padding: 12px 20px; border-radius: var(--radius);
  opacity: 0; transition: opacity .25s ease-out, transform .25s ease-out;
  pointer-events: none; max-width: calc(100vw - 48px); z-index: 90;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 下载进度条（页面内，超过阈值走浏览器原生下载） */
#dlprog {
  position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%);
  width: min(86vw, 420px); background: var(--surface-2);
  border-radius: var(--radius); padding: 12px 16px; z-index: 95;
}
#dlprog .dl-top { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; margin-bottom: 8px; }
#dlprog .dl-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#dlprog .dl-pct { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

.modal { position: fixed; inset: 0; z-index: 80; background: rgba(12, 6, 3, .93); display: none; align-items: center; justify-content: center; }
.modal.on { display: flex; }
.mclose {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 18px); right: 18px;
  width: 44px; height: 44px; border-radius: var(--radius);
  background: var(--surface-2); display: flex; align-items: center; justify-content: center;
}
.mclose svg { width: 16px; height: 16px; color: var(--ink); }
.mclose:active { filter: brightness(1.4); }
.minner { display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 94vw; }
.minner img { max-width: 92vw; max-height: 76svh; border-radius: var(--radius); }
.minner video { max-width: 92vw; max-height: 76svh; border-radius: var(--radius); }
.minner audio { width: 80vw; }
.mcap { font-size: 14px; color: var(--muted); word-break: break-all; text-align: center; max-width: 80vw; }

/* ============ 动效层 ============ */
@keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .7s cubic-bezier(.16, 1, .3, 1) both; }
.d1 { animation-delay: .05s; } .d2 { animation-delay: .16s; }
.d3 { animation-delay: .27s; } .d4 { animation-delay: .38s; }

html.pre .reveal { opacity: 0; transform: translateY(22px); }
html.pre .reveal.in { opacity: 1; transform: none; animation: rise .7s cubic-bezier(.16, 1, .3, 1) both; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-delay: 0ms !important;
    transition-duration: .01ms !important;
  }
  html.pre .reveal { opacity: 1; transform: none; }
}

@media (max-width: 640px) {
  .shares-head { flex-direction: column; align-items: flex-start; gap: 10px; }
  .count { padding: 0; }
}

/* ============ 宽屏：整列挂在 27% 对齐线上 ============ */
@media (min-width: 900px) {
  .hero { margin-top: 130px; }
  .top { padding-top: 28px; }
  .hero, .shares, .gallery, .send, footer { margin-left: 27vw; padding-left: 0; padding-right: var(--margin); }
  .top { margin-left: 27vw; padding-left: 0; }
  .shares, .gallery, .send { margin-top: 150px; }
  .fragment { max-width: 720px; }
  .tiles { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>

<script>
document.documentElement.classList.add('pre');
window.setTimeout(function () {
  var els = document.querySelectorAll('.reveal');
  for (var i = 0; i < els.length; i++) els[i].classList.add('in');
}, 3500);
</script>

<script>
"use strict";
/* ================= 基础工具 ================= */
const $ = s => document.querySelector(s);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const enc = encodeURIComponent;

function human(b) {
  if (b == null) return "";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let v = b, i = 0;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)) + " " + u[i];
}
function ext(n) { const i = n.lastIndexOf("."); return i < 0 ? "" : n.slice(i + 1).toLowerCase(); }
function isImage(n) { return ["jpg","jpeg","png","gif","webp","bmp","svg","ico","heic","avif"].includes(ext(n)); }
function mediaKind(n) {
  const e = ext(n);
  if (isImage(n)) return "img";
  if (["mp4","webm","mov","m4v"].includes(e)) return "video";
  if (["mp3","flac","wav","aac","ogg","m4a"].includes(e)) return "audio";
  return null;
}
const dlUrl = (id, path) => `/dl/${id}?path=${enc(path || "")}`;
const inlineUrl = (id, path) => `/dl/${id}?path=${enc(path || "")}&disposition=inline`;

/* ================= 图标（扁平 SVG，一套语言） ================= */
const IC = {
  folder: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4.1c.6 0 1.2.24 1.7.7l1.4 1.3h6A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>',
  file:   '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 2.8h7.2L19 8.6v12.6H6z"/><path d="M13 2.6v6.2h5.9z" fill="#3b2013"/></svg>',
  down:   '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v11m0 0 4.2-4.2M12 14 7.8 9.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 17.5h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  chev:   '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  play:   '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>',
};

/* ================= 状态 ================= */
let UPLOADS_ID = "uploads";
let ROOTS = [];
let cur = null;                 // { id, path } 或 null（根视图）
let lastRev = -1, lastUp = -1;
let rootsKey = "", dirKey = "";

let toastTimer = 0;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

/* ================= 渲染 ================= */
function rowHtml(e, delay) {
  const isDir = e.kind === "dir";
  const mk = isDir ? null : mediaKind(e.name);
  const thumb = !isDir && isImage(e.name)
    ? `<img loading="lazy" src="${inlineUrl(cur ? cur.id : e.id, cur ? e._full : "")}" alt="" width="48" height="48">`
    : isDir ? IC.folder : IC.file;
  const badge = mk && mk !== "img"
    ? `<span class="badge">${IC.play}</span>` : "";
  const meta = isDir ? "文件夹" : `${human(e.size)}${e.mtime ? " · " + e.mtime : ""}`;
  const side = isDir
    ? `<span class="side">${IC.chev}</span>`
    : `<span class="side"><span class="size">${human(e.size)}</span>
         <button class="go" data-act="dl" title="下载" aria-label="下载">${IC.down}</button></span>`;
  return `<div class="row reveal in" role="button" tabindex="0" style="animation-delay:${delay}ms"
      data-id="${e.id || ""}" data-path="${esc(e._full || "")}"
      data-kind="${e.kind}" data-name="${esc(e.name)}" data-size="${e.size ?? ""}">
    <span class="thumb">${thumb}${badge}</span>
    <span class="mcol"><span class="nm">${esc(e.name)}</span><span class="meta">${meta}</span></span>
    ${side}</div>`;
}

function crumbHtml(blocks) {
  return blocks.map(b =>
    `<button class="crumb${b.on ? " on" : ""}" data-nav="${enc(b.nav || "")}">${esc(b.name)}</button>`).join("");
}

function renderRoots() {
  cur = null; dirKey = "";
  $("#crumb").innerHTML = crumbHtml([{ name: "全部共享", on: true, nav: "" }]);
  $("#count").textContent = ROOTS.length ? `${ROOTS.length} 项 · 实时更新` : "";
  const rows = [];
  rows.push(rowHtml({ id: UPLOADS_ID, kind: "dir", name: "已收到的文件",
    _meta: 0, size: 0, mtime: "", _full: "" }, 0));
  ROOTS.forEach((r, i) => rows.push(rowHtml({ ...r, _full: "" }, Math.min(i + 1, 8) * 55)));
  let h = rows.join("");
  if (!ROOTS.length) {
    h += `<p class="hint">在这台电脑的 QookiL 窗口里，把文件或文件夹拖进共享列表，它们会立刻出现在这里。</p>`;
  }
  $("#list").innerHTML = h;
}

function renderDir(j) {
  cur = { id: j._id, path: j.path || "" };
  const parts = (j.path || "").split("/").filter(Boolean);
  const blocks = [{ name: "全部共享", nav: "__roots__" }, { name: j.name, on: true, nav: "" }];
  let acc = "";
  for (const p of parts) {
    acc = acc ? acc + "/" + p : p;
    blocks.push({ name: p, nav: acc });
  }
  $("#crumb").innerHTML = crumbHtml(blocks);
  $("#count").textContent = j.entries.length ? `${j.entries.length} 项` : "";
  const entries = (j.entries || []).slice().sort((a, b) =>
    a.kind === b.kind ? a.name.localeCompare(b.name, "zh") : (a.kind === "dir" ? -1 : 1));
  entries.forEach(e => { e._full = (j.path ? j.path + "/" : "") + e.name; });
  $("#list").innerHTML = entries.length
    ? entries.map((e, i) => rowHtml(e, Math.min(i, 8) * 55)).join("")
    : `<p class="hint">这个文件夹是空的。</p>`;
}

/* ================= 照片区块 ================= */
let galleryKey = "";

async function collectPhotos() {
  const photos = [];
  for (const r of ROOTS) {
    if (r.kind === "file" && isImage(r.name))
      photos.push({ id: r.id, path: "", name: r.name });
    if (photos.length >= 6) return photos;
  }
  // 文件夹里也找找（最多翻 4 个文件夹，收到 6 张就停）
  let folders = 0;
  for (const r of ROOTS) {
    if (r.kind !== "dir" || folders >= 4) break;
    folders++;
    try {
      const res = await fetch(`/api/items/${r.id}?path=`);
      if (!res.ok) continue;
      const j = await res.json();
      for (const e of j.entries || []) {
        if (e.kind === "file" && isImage(e.name))
          photos.push({ id: r.id, path: e.name, name: e.name });
        if (photos.length >= 6) return photos;
      }
    } catch { /* 单个文件夹失败不影响其余 */ }
  }
  return photos;
}

async function updateGallery() {
  try {
    const photos = await collectPhotos();
    const key = JSON.stringify(photos);
    if (key === galleryKey) return;
    galleryKey = key;
    const sec = $("#gallery");
    if (!photos.length) { sec.hidden = true; return; }
    sec.hidden = false;
    $("#tiles").innerHTML = photos.map((p, i) =>
      `<button class="tile reveal in" style="animation-delay:${Math.min(i, 6) * 60}ms"
        data-id="${p.id}" data-path="${esc(p.path)}" data-name="${esc(p.name)}" title="${esc(p.name)}">
        <img src="${inlineUrl(p.id, p.path)}" alt="${esc(p.name)}"></button>`).join("");
  } catch { /* 照片区块失败不影响文件列表 */ }
}

$("#tiles").addEventListener("click", ev => {
  const tile = ev.target.closest(".tile");
  if (tile) view(tile.dataset.id, tile.dataset.path, "img", tile.dataset.name);
});

/* ================= 数据获取与实时刷新 ================= */
async function fetchRoots() {
  const r = await fetch("/api/roots");
  if (!r.ok) throw new Error("roots " + r.status);
  const j = await r.json();
  UPLOADS_ID = j.uploadsId || "uploads";
  return j.roots || [];
}

async function openDir(id, path) {
  try {
    const r = await fetch(`/api/items/${id}?path=${enc(path || "")}`);
    const j = await r.json().catch(() => null);
    if (!r.ok || !j) { toast((j && j.message) || "打不开这个文件夹"); return; }
    j._id = id;
    dirKey = JSON.stringify(j);
    swap(() => renderDir(j));
  } catch { toast("网络错误"); }
}

function swap(render) {
  const f = $("#browser");
  if (REDUCED) { render(); return; }
  f.classList.add("swap");
  setTimeout(() => { render(); f.classList.remove("swap"); }, 280);
}

async function refresh() {
  try {
    if (!cur) {
      const roots = await fetchRoots();
      const key = JSON.stringify(roots);
      if (key !== rootsKey) { rootsKey = key; ROOTS = roots; swap(renderRoots); }
    } else {
      const r = await fetch(`/api/items/${cur.id}?path=${enc(cur.path)}`);
      if (r.status === 404) {
        toast("这个共享已被移除");
        cur = null; rootsKey = "";
        const roots = await fetchRoots();
        ROOTS = roots; swap(renderRoots);
        return;
      }
      if (!r.ok) return;
      const j = await r.json();
      j._id = cur.id;
      const key = JSON.stringify(j);
      if (key !== dirKey) { dirKey = key; swap(() => renderDir(j)); }
    }
  } catch { /* 断线时保持当前内容 */ }
}

let HOST = "";

function setLive(ok) {
  $("#liveDot").classList.toggle("on", ok);
  $("#liveText").textContent = ok
    ? `已连接 ${HOST} · 共享 ${ROOTS.length} 项`
    : "连接中断，正在重试…";
}

async function poll() {
  if (document.hidden) return;
  try {
    const j = await (await fetch("/api/info")).json();
    HOST = j.host || HOST;
    setLive(true);
    if (j.rev !== lastRev || j.uploads !== lastUp) {
      const first = lastRev === -1;
      lastRev = j.rev; lastUp = j.uploads;
      if (!first) { refresh(); updateGallery(); }
    }
  } catch { setLive(false); }
}

/* ================= 交互 ================= */

/* 下载：页面内显示进度；超大文件或并发时交给浏览器原生下载（系统下载栏有进度） */
let dlBusy = false;
const DL_INPAGE_LIMIT = 300 * 1024 * 1024;

function downloadFile(id, path, name, sizeText) {
  const raw = Number(sizeText);
  if (!Number.isFinite(raw) || raw > DL_INPAGE_LIMIT || dlBusy) {
    location.href = dlUrl(id, path);
    return;
  }
  dlBusy = true;
  const panel = $("#dlprog");
  $("#dlname").textContent = name;
  $("#dlpct").textContent = "0%";
  $("#dlbar").style.width = "0%";
  panel.hidden = false;

  const xhr = new XMLHttpRequest();
  xhr.open("GET", dlUrl(id, path));
  xhr.responseType = "blob";
  xhr.onprogress = e => {
    if (!e.lengthComputable) return;
    const p = Math.round(e.loaded / e.total * 100);
    $("#dlpct").textContent = p + "%";
    $("#dlbar").style.width = p + "%";
  };
  xhr.onload = () => {
    dlBusy = false; panel.hidden = true;
    if (xhr.status !== 200) { toast("下载失败"); return; }
    try {
      const url = URL.createObjectURL(xhr.response);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      toast("已保存 " + name);
    } catch (err) {
      location.href = dlUrl(id, path); // 该环境不支持 blob 保存时回退原生下载
    }
  };
  xhr.onerror = () => { dlBusy = false; panel.hidden = true; toast("下载失败：连接中断，请检查电脑端服务是否仍在运行"); };
  xhr.send();
}

$("#list").addEventListener("click", ev => {
  const go = ev.target.closest(".go");
  const row = ev.target.closest(".row");
  if (!row) return;
  const id = row.dataset.id || (cur && cur.id);
  const path = row.dataset.path || "";
  const name = row.dataset.name || "";
  if (go) { downloadFile(id, path, name, row.dataset.size); return; }
  if (row.dataset.kind === "dir") { openDir(id, path); return; }
  const mk = mediaKind(name);
  if (mk) view(id, path, mk, name);
  else downloadFile(id, path, name, row.dataset.size);
});

$("#list").addEventListener("keydown", ev => {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  const row = ev.target.closest(".row");
  if (!row || ev.target !== row) return;
  ev.preventDefault();
  row.click();
});

$("#crumb").addEventListener("click", ev => {
  const b = ev.target.closest(".crumb");
  if (!b) return;
  const nav = b.dataset.nav;
  if (nav === "__roots__" || !cur) { refresh(); return; }
  if (nav === "" && b.classList.contains("on")) return;
  if (nav === "") { openDir(cur.id, ""); return; }
  openDir(cur.id, decodeURIComponent(nav));
});

$("#uploadsLink").addEventListener("click", () => openDir(UPLOADS_ID, ""));

function view(id, path, mk, name) {
  const url = inlineUrl(id, path);
  const inner = $("#minner");
  if (mk === "img") inner.innerHTML = `<img src="${url}" alt="${esc(name)}"><p class="mcap">${esc(name)}</p>`;
  else if (mk === "video") inner.innerHTML = `<video src="${url}" controls autoplay playsinline></video><p class="mcap">${esc(name)}</p>`;
  else inner.innerHTML = `<audio src="${url}" controls autoplay></audio><p class="mcap">${esc(name)}</p>`;
  $("#modal").classList.add("on");
}
function closeModal() {
  $("#modal").classList.remove("on");
  $("#minner").innerHTML = "";
}
$("#mclose").addEventListener("click", closeModal);
$("#modal").addEventListener("click", ev => { if (ev.target.id === "modal") closeModal(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeModal(); });

/* ================= 上传 ================= */
$("#pickHero").addEventListener("click", () => $("#file").click());
$("#pickSend").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", () => {
  if ($("#file").files.length) upload([...$("#file").files]);
  $("#file").value = "";
});
const send = $("#send");
["dragover", "dragenter"].forEach(t =>
  send.addEventListener(t, e => { e.preventDefault(); }));
send.addEventListener("drop", e => {
  e.preventDefault();
  const fs = [...(e.dataTransfer ? e.dataTransfer.files : [])];
  if (fs.length) upload(fs);
});

function upload(files) {
  const fd = new FormData();
  files.forEach(f => fd.append("files", f, f.name));
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/upload");
  xhr.upload.onprogress = e => {
    if (!e.lengthComputable) return;
    const p = Math.round(e.loaded / e.total * 100);
    $("#fill").style.width = p + "%";
    $("#ptext").textContent = `正在发送 ${p}% · ${human(e.loaded)} / ${human(e.total)}`;
  };
  xhr.onload = () => {
    $("#prog").hidden = true;
    $("#fill").style.width = "0%";
    let j = null;
    try { j = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status === 200 && j && j.ok) {
      toast(`已发送 ${j.count} 个文件 · ${human(j.totalBytes)}`);
      if (cur && cur.id === UPLOADS_ID) refresh();
    } else {
      toast((j && j.message) || "发送失败");
    }
  };
  xhr.onerror = () => {
    $("#prog").hidden = true;
    toast("网络错误，发送失败：请确认手机与电脑在同一 Wi‑Fi、电脑端服务运行中且防火墙已放行");
  };
  $("#prog").hidden = false;
  $("#ptext").textContent = "正在发送…";
  xhr.send(fd);
}

/* ================= 入场动效 ================= */
const io = "IntersectionObserver" in window
  ? new IntersectionObserver(es => es.forEach(x => {
      if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); }
    }), { threshold: 0.12 })
  : null;
document.querySelectorAll(".reveal").forEach(el => {
  if (io) io.observe(el); else el.classList.add("in");
});

document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

/* ================= 启动 ================= */
(async () => {
  await poll();
  try {
    ROOTS = await fetchRoots();
    rootsKey = JSON.stringify(ROOTS);
    renderRoots();
    setLive(true);
    updateGallery();
  } catch {
    $("#list").innerHTML = '<p class="hint">加载失败，请刷新重试。</p>';
  }
  setInterval(poll, 2500);
})();
</script>
