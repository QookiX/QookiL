name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与测试（windows x64）
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 本地 NuGet.config 指向国内镜像（本机网络原因）；CI 运行器在国外，换回官方源
      - name: 使用 nuget.org 官方源
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          '@ | Set-Content -Path NuGet.config -Encoding UTF8

      - name: 还原依赖
        run: dotnet restore QookiL/QookiL.csproj -p:Platform=x64

      - name: 编译（Release x64）
        run: dotnet build QookiL/QookiL.csproj -c Release -p:Platform=x64 --no-restore

      - name: 网页服务器冒烟测试（17 项）
        run: dotnet run --project tools/ServerSmoke -c Release --nologo

      - name: 发布自包含绿色版（win-x64）
        run: dotnet publish QookiL/QookiL.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true --nologo -o publish

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QookiL-win-x64
          path: publish/
          retention-days: 14
